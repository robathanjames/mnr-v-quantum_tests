name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[aer,dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Test exact and sampled execution
        run: pytest
      - name: Check entry points and build
        run: |
          python mnr-v_c.py --batch-size 2 --steps 1 --json
          python -m mnr_quantum --batch-size 2 --shots 128 --json
          mnr-quantum --batch-size 2 --image-size 16 --json
          python -m build
